[workspace]
resolver = "3"
members = ["crates/format", "crates/overlay", "crates/editor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/tacobellerontop-sudo/crosslay"

[workspace.dependencies]
crosslay-format = { path = "crates/format" }
windows-sys = "0.59"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The overlay runs all the time; smaller beats faster for code that runs once.
[profile.release.package.crosslay]
opt-level = "z"

[profile.release.package.crosslay-format]
opt-level = "z"
