[package]
name = "crosslay"
version = "0.1.0"
edition = "2024"
description = "A tiny, zero-overhead screen overlay (crosshairs first, images next)"
readme = "README.md"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
