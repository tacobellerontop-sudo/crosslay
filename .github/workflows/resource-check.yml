name: Resource check

# Starts the overlay on a Windows runner and reports what it costs while idle
# (memory, CPU time, threads, handles, loaded DLLs), so regressions show up.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p crosslay -p crosslay-editor

      - name: Measure overlay
        shell: pwsh
        run: ./scripts/measure-overlay.ps1 -Overlay target/release/crosslay.exe -Editor target/release/crosslay-editor.exe

      - name: Summary
        shell: pwsh
        run: |
          $r = Get-Content "$env:RUNNER_TEMP/measure.json" | ConvertFrom-Json
          $md = "### Idle overlay`n`n| Metric | Value |`n|---|---|`n"
          foreach ($k in "exe_size_kb","working_set_kb","private_bytes_kb","peak_working_kb","cpu_ms_in_20s","threads","handles","module_count") {
            $md += "| $k | $($r.$k) |`n"
          }
          $md += "`n**Loaded modules:** $($r.modules)`n"
          $md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $md
