name: Build exe

# Builds standalone crosslay.exe files.
#  - Every push: exes are uploaded as workflow artifacts (Actions tab -> run -> Artifacts).
#  - Run manually: Actions tab -> "Build exe" -> "Run workflow".
#  - Push a tag like v0.1.0: the zips are also attached to a GitHub Release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      # Link the C runtime statically so the exe runs without the
      # Visual C++ Redistributable installed.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.sha }}".Substring(0, 7) }
          $name = "crosslay-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path dist/$name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/crosslay.exe dist/$name/
          Copy-Item README.md dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-${{ matrix.arch }}
          path: dist/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
