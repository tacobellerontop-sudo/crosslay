name: Build

# Builds crosslay.exe (overlay) and crosslay-editor.exe (editor) for Windows.
#  - Every push: the exes are uploaded as workflow artifacts (Actions tab -> run -> Artifacts).
#  - Run by hand: Actions tab -> "Build" -> "Run workflow".
#  - Push a tag like v0.1.0: a GitHub Release is published with the zips and
#    the bare exes. The in-app updater downloads the bare exes, so the tag must
#    match the version in Cargo.toml.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      # Link the C runtime statically so the exes run without the
      # Visual C++ Redistributable installed.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in Cargo.toml. Bump the version first, or the updater would reinstall this release forever."
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build overlay
        run: cargo build --release --locked --target ${{ matrix.target }} -p crosslay

      - name: Build editor
        run: cargo build --release --locked --target ${{ matrix.target }} -p crosslay-editor

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.sha }}".Substring(0, 7) }
          $name = "crosslay-$version-windows-${{ matrix.arch }}"
          $out = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path dist/$name | Out-Null
          Copy-Item $out/crosslay.exe, $out/crosslay-editor.exe, README.md dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          # Bare exes for the in-app updater.
          New-Item -ItemType Directory -Path dist/bare | Out-Null
          Copy-Item $out/crosslay.exe dist/bare/crosslay-windows-${{ matrix.arch }}.exe
          Copy-Item $out/crosslay-editor.exe dist/bare/crosslay-editor-windows-${{ matrix.arch }}.exe
          "name=$name" >> $env:GITHUB_OUTPUT
          $rows = Get-ChildItem dist/$name/*.exe | ForEach-Object { "| $($_.Name) | $([math]::Round($_.Length / 1KB)) KB |" }
          "### ${{ matrix.arch }}`n`n| File | Size |`n|---|---|`n$($rows -join "`n")`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/${{ steps.package.outputs.name }}.zip
            dist/bare/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/bare/*.exe
          generate_release_notes: true
